version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: America/Bogota
    open-pull-requests-limit: 5
    labels: [dependencias]
    commit-message:
      prefix: 'chore(deps)'
    groups:
      react:
        patterns: ['react', 'react-dom', '@types/react', '@types/react-dom']
      herramientas:
        patterns:
          [
            'vite',
            'vitest',
            '@vitejs/*',
            '@vitest/*',
            'typescript',
            'eslint*',
            'typescript-eslint',
            'prettier',
          ]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencias]
